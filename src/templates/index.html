<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinUni ReAct Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --bot-bg: rgba(59, 130, 246, 0.15);
            --user-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            font-size: 24px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .header-text p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
            animation: slideUp 0.3s ease-out;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-bg);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-bottom-left-radius: 4px;
        }

        .step-block {
            margin-top: 10px;
            font-size: 13.5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            overflow: hidden;
        }

        .step-header {
            padding: 8px 12px;
            font-weight: 500;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-content {
            padding: 10px 12px;
            color: var(--text-muted);
            white-space: pre-wrap;
            font-family: monospace;
        }

        .action-block { border-left-color: #f59e0b; }
        .action-block .step-header { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        
        .thought-block { border-left-color: #8b5cf6; }
        .thought-block .step-header { color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }

        .input-area {
            padding: 20px 30px;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            background: var(--user-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 8px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            padding: 10px 15px;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--bot-bg);
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            gap: 4px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-icon">🤖</div>
            <div class="header-text">
                <h1>ReAct Agent</h1>
                <p>AI thông minh có khả năng suy luận & dùng công cụ</p>
            </div>
        </div>

        <div class="chat-container" id="chatbox">
            <div class="message bot">
                Xin chào! Tôi là trợ lý AI tìm nhà trọ tại Hà Nội. Bạn cần tìm phòng khu vực nào, ngân sách bao nhiêu?
            </div>
            
            <div class="typing-indicator" id="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn vào đây..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()">
                    Gửi 
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');

        let currentBotMessage = null; // Container cho response hiện tại của bot

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            chatbox.insertBefore(msgDiv, typing);
            chatbox.scrollTop = chatbox.scrollHeight;
            return msgDiv;
        }

        function createStepBlock(type, title, content) {
            const icon = type === 'thought' ? '🧠' : (type === 'action' ? '🛠️' : '👁️');
            const colorClass = type === 'thought' ? 'thought-block' : (type === 'action' ? 'action-block' : '');
            return `
                <div class="step-block ${colorClass}">
                    <div class="step-header">${icon} ${title}</div>
                    <div class="step-content">${content}</div>
                </div>
            `;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Disable input
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            appendMessage(text, 'user');
            
            // Show typing indicator
            typing.classList.add('active');
            chatbox.scrollTop = chatbox.scrollHeight;

            // Prepare bot message container
            currentBotMessage = appendMessage('', 'bot');
            currentBotMessage.style.display = 'none'; // Ẩn đi cho đến khi có data
            
            let htmlContent = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6);
                            try {
                                const data = JSON.parse(dataStr);
                                currentBotMessage.style.display = 'block';
                                
                                if (data.type === 'step') {
                                    // Bỏ qua hiển thị cái title step
                                } else if (data.type === 'thought') {
                                    htmlContent += createStepBlock('thought', 'Suy luận (Thought)', data.content);
                                } else if (data.type === 'action') {
                                    htmlContent += createStepBlock('action', 'Gọi Công Cụ (Action)', data.content);
                                } else if (data.type === 'observation') {
                                    const shortObs = data.content.length > 200 ? data.content.substring(0, 200) + '...' : data.content;
                                    htmlContent += createStepBlock('observation', 'Kết quả (Observation)', shortObs);
                                } else if (data.type === 'final_answer') {
                                    // Tách Final Answer ra ngoài cùng
                                    htmlContent += `<div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1)"><strong>Câu trả lời:</strong><br><br>${data.content.replace(/\\n/g, '<br>')}</div>`;
                                } else if (data.type === 'warning') {
                                    htmlContent += `<div style="color: #ef4444; margin-top: 10px;">⚠️ ${data.content}</div>`;
                                }
                                
                                currentBotMessage.innerHTML = htmlContent;
                                chatbox.scrollTop = chatbox.scrollHeight;
                            } catch (e) {
                                console.error("Parse error", e);
                            }
                        }
                    }
                }
            } catch (error) {
                currentBotMessage.style.display = 'block';
                currentBotMessage.innerHTML = `<span style="color: #ef4444">Lỗi kết nối tới Server.</span>`;
            } finally {
                typing.classList.remove('active');
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatbox.scrollTop = chatbox.scrollHeight;
            }
        }
    </script>
</body>
</html>
